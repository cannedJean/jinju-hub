# 진주 유등 30선 — 초안(DRAFT). 사용자 확정을 기다리는 중이다.
# 2026-11-04 첫 실데이터(진주시 OpenAPI만, TourAPI 키 미발급) places.db를 보고 작성했다.
# 구성(스펙 §5.8): 진주8경 8 + 대표 명소·박물관 10 + 향토 맛집·먹거리 6 + 야경/체험 6 = 30.
# 진주시 음식점 API에는 향토 음식점이 적어(냉면·비빔밥 메뉴가 있는 곳은 하연옥 하대점뿐) 먹거리 묶음에
# 전통시장·음식 체험을 넣었다. TourAPI(음식점 39) 수집 후 다시 고르는 것을 권한다.
#
# 각 항목의 match 는 반드시 장소 하나로 해석되어야 한다(미해석 = 게이트 실패).
#   near = 진주시 API 좌표(소수 4자리), category 로 동명 이소(예: 음식점 "촉석루")를 구분한다.
# group / reason 은 사람이 읽는 메모이며 파이프라인은 쓰지 않는다.
# source_keys: 선택. TourAPI/진주시 원천 키("<source>:<source_id>")를 알게 되면 채운다 (러너가 collection_source_keys로 읽음).
#   2026-11-04 TourAPI 보강 실행 후, 이미 병합된(또는 force_merge한) TourAPI 항목이 있는 14곳에 채웠다 → 그 항목은 detailImage2(갤러리)를 받는다.
#   1:1이 아닌 후보(진주중앙시장·논개시장 통합 항목, 하연옥 본점≠하대점, 의기사와 의암≠제2경)는 넣지 않았다.
