# 병합 예외 — "<source>:<source_id>" 쌍. force_merge가 먼저 적용되고, force_split은 자동 매칭보다 우선한다
# (컴포넌트 단위: 두 키가 같은 그룹이 되는 결합은 모두 거부).
# 자동 병합은 증거 강도 순(같은 이름 → 같은 전화 → 이름 유사)으로 결합하므로 레코드 키 정렬 순서에 따라
# 결과가 바뀌지 않는다(K4). 아래 항목은 2026-11-04 실데이터(run 20261104T125916+0900의 clean.jsonl)에서
# 항목을 빼고 병합을 다시 돌려 그룹이 달라지는 것만 남겼다.
# K4에서 제거: 진주성 우물(1163) ↔ 진주성(TourAPI 126833) — 증거 강도 순 결합에서는 진주시 "진주성"(605)이
# TourAPI 진주성과 같은 이름으로 먼저 묶이고, 아래 605↔1163 분리가 우물을 막는다.
force_merge:
  # 진주 레일바이크: 진주시 관광지(sight) ↔ TourAPI 레포츠(leisure) — 카테고리 그룹이 달라 자동 비교 대상이 아님.
  - [jinju_city.tourinfo:780, tourapi.area:1987215]
  # 진주정원박람회 ↔ 2026 진주 정원박람회: 같은 좌표·기간인데 이름 앞 연도 때문에 이름 매칭이 안 되고,
  # 전화는 부서 대표번호(공유 번호)라 근거가 되지 않는다.
  - [jinju_city.festival:1621, tourapi.festival:3494070]
force_split:
  # token_set_ratio는 짧은 이름이 긴 이름에 포함되면 100 → 서로 다른 진주시 관광지 목록이 이름 유사로 합쳐진다.
  - [jinju_city.tourinfo:605, jinju_city.tourinfo:1163]   # 진주성 ↔ 진주성 우물 (빼면 우물이 진주성 그룹에 합쳐짐)
  - [jinju_city.tourinfo:402, jinju_city.tourinfo:626]    # 진양호 ↔ 제8경 진양호 노을 (진주8경 항목 보존)
  - [jinju_city.tourinfo:94, jinju_city.tourinfo:623]     # 망진산 ↔ 제5경 망진산 봉수대 (진주8경 항목 보존)
  # 제1경 촉석루 체인: TourAPI "촉석루"가 진주시 "진주 촉석루"(504)와 같은 이름으로 묶인 뒤, 진주시 "제1경 진주성 촉석루"(621)가
  # 이름 유사로 그 그룹에 붙어 진주8경 제1경 항목이 사라진다(큐레이션 fallback 사용). 이 항목 하나로 621이 그룹 밖에 남는다.
  - [jinju_city.tourinfo:621, tourapi.area:126217]     # 제1경 진주성 촉석루 ↔ 촉석루(TourAPI)
  # 김시민호(유람선) ↔ 물빛나루쉼터(TourAPI): 같은 선착장 전화번호 → 빼면 30선 "김시민호"가 물빛나루쉼터 그룹에 합쳐져
  # 큐레이션 미해석(게이트 실패).
  - [jinju_city.tourinfo:1388, tourapi.area:3058179]
  # 진주논개제 ↔ 국가유산 미디어아트 진주성: 같은 주최 전화번호. TourAPI는 이 행사를 관광지(area)와 축제(festival)에
  # 같은 contentid·같은 이름으로 올려 둘이 먼저 묶이므로 지금은 두 항목 중 하나만 있어도 분리된다(둘 다 빼면 합쳐짐).
  # 축제 목록은 기간에 따라 빠질 수 있어 어느 한쪽 레코드만 남아도 막히도록 둘 다 둔다.
  - [jinju_city.festival:701, tourapi.area:3333059]
  - [jinju_city.festival:701, tourapi.festival:3333059]
  # 미디어 파사드(물초울공원 중앙광장) ↔ 물초울공원(TourAPI): 이름 유사(포함 관계) — 공원 안의 시설과 공원은 다른 장소.
  - [jinju_city.tourinfo:1522, tourapi.area:2894553]
